[workspace]
resolver = "2"
members = [
    "crates/slate-core",
    "crates/slate-input",
    "crates/slate-renderer",
    "crates/slate-effects",
    "crates/slate-node",
]

[workspace.package]
version = "2.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Slate contributors"]
repository = "https://github.com/AnThophicous/Slate"
homepage = "https://github.com/AnThophicous/Slate"
readme = "README.md"

[workspace.dependencies]
bitflags = "2.9"
crossterm = "0.29"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-build = "2"
napi-derive = "3"
thiserror = "2.0"
unicode-width = "0.2"
unicode-segmentation = "1.13"
