name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run examples:typecheck
      - run: npm run pack:check

  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run native:build
      - uses: actions/upload-artifact@v4
        with:
          name: slate-native-${{ matrix.os }}
          path: packages/slate-native/*.node
          if-no-files-found: error

  github-release:
    needs: [validate, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.node

  npm-publish:
    needs: [validate, native]
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: cp release-assets/*.node packages/slate-native/
      - name: Publish packages through npm Trusted Publishing
        shell: bash
        run: |
          publish_if_missing() {
            package="$1"
            version="$2"
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version already exists; skipping"
            else
              npm publish --workspace "$package" --access public
            fi
          }
          publish_if_missing @slate-terminal/core 2.2.0
          publish_if_missing @slate-terminal/react 2.2.0
          publish_if_missing @slate-terminal/native 2.2.0
