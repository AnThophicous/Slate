name: Bug report
description: Report a reproducible problem in Slate
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Slate version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Rust
        - Node.js
        - TypeScript
        - Terminal
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
